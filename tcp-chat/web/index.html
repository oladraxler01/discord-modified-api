<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEIL TCP Chat</title>
<style>
  :root { --bg:#0f172a; --panel:#111827; --line:#1f2937; --text:#e5e7eb; --muted:#94a3b8; --accent:#8b5cf6; --me:#4c1d95; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  header input { background:var(--panel); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:8px; }
  button { background:var(--accent); color:#fff; border:0; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600; }
  button.secondary { background:#334155; }
  button:disabled { opacity:.4; cursor:default; }
  #info { font-size:12px; color:var(--muted); font-family: ui-monospace, Consolas, monospace; }
  main { flex:1; display:flex; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; }
  aside { width:200px; border-left:1px solid var(--line); padding:12px; font-size:14px; }
  aside h2 { font-size:13px; color:var(--muted); text-transform:uppercase; margin:0 0 8px; }
  .msg { max-width:70%; padding:8px 12px; border-radius:12px; background:var(--panel); align-self:flex-start; }
  .msg.me { background:var(--me); align-self:flex-end; }
  .msg .meta { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .sys { align-self:center; font-size:12px; color:var(--muted); }
  .err { align-self:center; font-size:12px; color:#f87171; }
  footer { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  footer input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:10px; border-radius:8px; }
  @media (max-width:640px){ aside{display:none} .msg{max-width:90%} }
</style>
</head>
<body>
<header>
  <h1>VEIL TCP Chat</h1>
  <input id="name" placeholder="username (2-20: letters, digits, _ -)" maxlength="20">
  <button id="connect">Connect</button>
  <button id="quit" class="secondary" disabled>Quit</button>
  <button id="ping" class="secondary" disabled>Ping</button>
  <span id="info">not connected</span>
</header>
<main>
  <div id="log"></div>
  <aside><h2>Online</h2><div id="users"></div></aside>
</main>
<footer>
  <input id="text" placeholder="Message everyone, or /dm user text" disabled maxlength="1000">
  <button id="send" disabled>Send</button>
</footer>
<script>
const $ = (id) => document.getElementById(id);
let ws, me, online = new Set();
const t = (ts) => new Date(ts).toLocaleTimeString();
const scroll = () => { $("log").scrollTop = $("log").scrollHeight; };
const line = (cls, text) => { const d = document.createElement("div"); d.className = cls; d.textContent = text; $("log").append(d); scroll(); };
const bubble = (from, text, meta) => {
  const d = document.createElement("div"); d.className = "msg" + (from === me ? " me" : "");
  const m = document.createElement("div"); m.className = "meta"; m.textContent = meta;
  const b = document.createElement("div"); b.textContent = text;
  d.append(m, b); $("log").append(d); scroll();
};
const renderUsers = () => { $("users").textContent = ""; [...online].sort().forEach((u) => { const d = document.createElement("div"); d.textContent = (u === me ? "● " : "○ ") + u; $("users").append(d); }); };
const setConnected = (on) => { $("connect").disabled = on; $("name").disabled = on; ["quit","ping","text","send"].forEach((id) => $(id).disabled = !on); };
const send = (m) => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

$("connect").onclick = () => {
  const name = $("name").value.trim();
  if (!name) return $("name").focus();
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  $("info").textContent = "connecting…";
  ws.onopen = () => send({ type: "hello", username: name });
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    switch (m.type) {
      case "gateway": $("info").textContent = `WebSocket ok · gateway opened TCP 127.0.0.1:${m.tcpLocalPort} → :${m.tcpServerPort}`; break;
      case "welcome":
        me = m.username; online = new Set(m.users); renderUsers(); setConnected(true);
        line("sys", `Welcome ${me}. TCP connection #${m.connectionId}: ${m.client.ip}:${m.client.port} → ${m.server.ip}:${m.server.port}`);
        m.history.forEach((h) => bubble(h.from, h.text, `#${h.seq} ${h.from} · ${t(h.ts)} (history)`));
        $("text").focus(); break;
      case "msg": bubble(m.from, m.text, `#${m.seq} ${m.from} · ${t(m.ts)}`); break;
      case "dm": bubble(m.from, m.text, `DM ${m.from} → ${m.to} · ${t(m.ts)}`); break;
      case "joined": online.add(m.username); renderUsers(); line("sys", `${m.username} joined`); break;
      case "left": online.delete(m.username); renderUsers(); line("sys", `${m.username} left (${m.reason})`); break;
      case "users": online = new Set(m.users); renderUsers(); break;
      case "pong": line("sys", `RTT ${(performance.now() - Number(m.t)).toFixed(1)} ms (browser → Render → TCP server → back)`); break;
      case "error": line("err", `${m.code}: ${m.message}`); break;
    }
  };
  ws.onclose = (e) => { setConnected(false); online.clear(); renderUsers(); line("sys", `Disconnected (code ${e.code})`); $("info").textContent = "not connected"; };
  ws.onerror = () => line("err", "WebSocket error");
};
$("quit").onclick = () => send({ type: "bye" });
$("ping").onclick = () => send({ type: "ping", t: String(performance.now()) });
const submit = () => {
  const text = $("text").value.trim(); if (!text) return;
  const dm = /^\/dm\s+(\S+)\s+(.+)$/.exec(text);
  send(dm ? { type: "dm", to: dm[1], text: dm[2] } : { type: "msg", text });
  $("text").value = "";
};
$("send").onclick = submit;
$("text").onkeydown = (e) => { if (e.key === "Enter") submit(); };
$("name").onkeydown = (e) => { if (e.key === "Enter") $("connect").click(); };
</script>
</body>
</html>
